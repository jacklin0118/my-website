<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Personal Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px;
            background-color: #f4f4f9;
            color: #333;
            text-align: center;
        }
        h1 { color: #2c3e50; }
        p { font-size: 18px; max-width: 600px; margin: 20px auto; }
    </style>
    <script
      type="module"
      src="https://cdn.perxona.ai/asia/prod/latest/widget/entry/index.js"
    ></script>
</head>
<body>

    <h1>Welcome to My Personal Website!</h1>
    <p>Hi, I am a beginner building my first web project. Feel free to talk to my AI assistant down in the corner!</p>

    <sv-agent
      agentProfileId="01KP8ABYYJEXFYFY5R5NPGP0DZ"
      presentationMode="bubble"
      apiKey="4df0b8b9-13a5-4f0d-aa99-607eacf94190"
    ></sv-agent>

    <script>
      // 確保網頁內容都載入完成後再執行
      window.addEventListener('DOMContentLoaded', () => {
        // 選擇網頁中的 <sv-agent> 元素
        const widget = document.querySelector('sv-agent');

        // 設定外觀與行為參數
        const layoutConfig = {
          presentationMode: 'bubble',
          readyToShowPolicy: 'showWhenAssetsReady',
          displayMode: 'fullPresentation',
          conversationMode: 'inputText',
          initFov: { distance: 1, horizontal: 0, vertical: 0 },
          cameraAngle: 'fullBody',
          colorMode: 'light',
          colorTheme: {
            primary: {
              light: '#fff',
              dark: '#000',
            },
          },
        };

        if (!widget) {
          console.error('sv-agent widget not found in the DOM.');
        } else if (typeof widget.updateWidgetSetting !== 'function') {
          console.error('updateWidgetSetting method is not available on sv-agent element.');
        } else {
          console.log('sv-agent is ready to use.');
          // 正式套用設定
          widget.updateWidgetSetting(layoutConfig);
        }
      });
    </script>

</body>
</html>
