<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Draggable AI Agent</title>

    <script
      type="module"
      src="https://cdn.perxona.ai/asia/prod/latest/widget/entry/index.js"
    ></script>

    <style>
        body {
            margin: 0;
            padding: 40px;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            min-height: 200vh;
        }

        h1 {
            color: #333;
        }

        p {
            max-width: 700px;
            line-height: 1.6;
        }

        /* ======================================================
           Agent 外層容器（真正被拖曳的是它）
           ====================================================== */
        .agent-container {
            position: fixed;
            right: 20px;
            bottom: 20px;

            width: 100px;
            height: 100px;

            z-index: 99999;

            touch-action: none;
        }

        /* ======================================================
           sv-agent 不要再 fixed
           ====================================================== */
        sv-agent {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* ======================================================
           小型拖曳按鈕
           ====================================================== */
        .drag-handle {
            position: absolute;

            top: -8px;
            left: -8px;

            width: 26px;
            height: 26px;

            background: #ff4081;
            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            color: white;
            font-size: 14px;
            font-weight: bold;

            cursor: grab;

            z-index: 100000;

            user-select: none;
        }

        .drag-handle:active {
            cursor: grabbing;
        }

        /* ======================================================
           Demo popup
           ====================================================== */
        .popup {
            position: fixed;

            top: 80px;
            right: 140px;

            width: 420px;

            background: white;
            border-radius: 20px;

            padding: 24px;

            box-shadow:
                0 10px 30px rgba(0,0,0,0.15);

            display: none;

            z-index: 99998;
        }

        .popup.show {
            display: block;
        }

        .popup h2 {
            margin-top: 0;
        }

        .close-btn {
            position: absolute;
            right: 18px;
            top: 14px;

            cursor: pointer;
            font-size: 24px;
        }

        .card-container {
            display: flex;
            gap: 12px;
            margin-top: 18px;
        }

        .card {
            flex: 1;
            background: #fafafa;
            border-radius: 12px;
            overflow: hidden;
        }

        .card img {
            width: 100%;
            height: 120px;
            object-fit: cover;
        }

        .card-body {
            padding: 12px;
        }

        .card-title {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .card-price {
            color: #e91e63;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>Welcome to My Website</h1>

    <p>
        This is a demo page with a draggable AI assistant.
        You can drag the pink button to move the AI bubble.
    </p>

    <!-- ======================================================
         Agent Container
         ====================================================== -->
    <div class="agent-container" id="agentContainer">

        <!-- 拖曳按鈕 -->
        <div class="drag-handle" id="dragHandle">
            ↕
        </div>

        <!-- Perxona Agent -->
        <sv-agent
          id="perxonaAgent"
          agentProfileId="01KP8ABYYJEXFYFY5R5NPGP0DZ"
          presentationMode="bubble"
          apiKey="4df0b8b9-13a5-4f0d-aa99-607eacf94190"
        ></sv-agent>
    </div>

    <!-- ======================================================
         Popup
         ====================================================== -->
    <div class="popup" id="popup">
        <div class="close-btn" id="closeBtn">&times;</div>

        <h2>日本三大花火大會</h2>

        <p>
            如果你想看日本三大花火大會之一的長岡煙火，
            現在有不同的行程可以選擇。
        </p>

        <div class="card-container">

            <div class="card">
                <img src="https://images.unsplash.com/photo-1533105079780-92b9be482077?w=500">

                <div class="card-body">
                    <div class="card-title">
                        長岡煙火 A區觀賞席
                    </div>

                    <div class="card-price">
                        TWD 5,500 起
                    </div>
                </div>
            </div>

            <div class="card">
                <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=500">

                <div class="card-body">
                    <div class="card-title">
                        長岡煙火 B區觀賞席
                    </div>

                    <div class="card-price">
                        TWD 12,500 起
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const container = document.getElementById('agentContainer');
        const dragHandle = document.getElementById('dragHandle');

        const popup = document.getElementById('popup');
        const closeBtn = document.getElementById('closeBtn');

        // ======================================================
        // 拖曳功能
        // ======================================================

        let isDragging = false;

        let offsetX = 0;
        let offsetY = 0;

        function startDrag(e) {
            isDragging = true;

            const clientX =
                e.clientX || e.touches[0].clientX;

            const clientY =
                e.clientY || e.touches[0].clientY;

            const rect =
                container.getBoundingClientRect();

            offsetX = clientX - rect.left;
            offsetY = clientY - rect.top;

            // 把 fixed 的 right/bottom 轉成 left/top
            container.style.left = rect.left + 'px';
            container.style.top = rect.top + 'px';

            container.style.right = 'auto';
            container.style.bottom = 'auto';

            e.preventDefault();
        }

        function drag(e) {
            if (!isDragging) return;

            const clientX =
                e.clientX || e.touches[0].clientX;

            const clientY =
                e.clientY || e.touches[0].clientY;

            let newLeft = clientX - offsetX;
            let newTop = clientY - offsetY;

            // 防止超出畫面
            newLeft = Math.max(
                0,
                Math.min(window.innerWidth - 100, newLeft)
            );

            newTop = Math.max(
                0,
                Math.min(window.innerHeight - 100, newTop)
            );

            container.style.left = newLeft + 'px';
            container.style.top = newTop + 'px';
        }

        function endDrag() {
            isDragging = false;
        }

        // Desktop
        dragHandle.addEventListener(
            'mousedown',
            startDrag
        );

        window.addEventListener(
            'mousemove',
            drag
        );

        window.addEventListener(
            'mouseup',
            endDrag
        );

        // Mobile
        dragHandle.addEventListener(
            'touchstart',
            startDrag,
            { passive: false }
        );

        window.addEventListener(
            'touchmove',
            drag,
            { passive: false }
        );

        window.addEventListener(
            'touchend',
            endDrag
        );

        // ======================================================
        // Demo popup
        // ======================================================

        // 假裝 agent 回覆觸發 popup
        setTimeout(() => {
            popup.classList.add('show');
        }, 3000);

        closeBtn.addEventListener('click', () => {
            popup.classList.remove('show');
        });
    </script>

</body>
</html>
