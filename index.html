<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Personal Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px;
            background-color: #f4f4f9;
            color: #333;
            text-align: center;
        }
        h1 { color: #2c3e50; }
        p { font-size: 18px; max-width: 600px; margin: 20px auto; }

        /* ========================================================
           1. 專屬外容器：不影響 Agent 原生展開，但能讓我們追蹤位置
           ======================================================== */
        .agent-container {
            position: fixed !important;
            bottom: 20px; 
            right: 20px;  
            width: 85px;  
            height: 85px; 
            z-index: 99999;
            touch-action: none;
        }

        sv-agent {
            width: 100% !important;
            height: 100% !important;
        }

        /* 隱形拖曳手把 */
        .drag-handle {
            position: absolute;
            top: 0;
            left: 0;
            width: 80px;      
            height: 80px;     
            border-radius: 50%;
            background: rgba(0, 0, 0, 0); 
            border: none;
            cursor: move;     
            z-index: 100001;  
        }

        /* ========================================================
           2. 行程卡片視窗（對齊展開面板專用樣式）
           ======================================================== */
        .itinerary-popup {
            display: none; 
            position: fixed;
            background: linear-gradient(135deg, #fce4ec 0%, #f3e5f5 100%);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            z-index: 99998;
            padding: 30px;
            box-sizing: border-box;
            text-align: left;
            overflow-y: auto;
            
            /* 寬度稍微拉長，讓它像截圖上一樣呈現舒適的長方形 */
            width: 55vw;
            max-width: 850px;
            
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 25px;
            font-size: 28px;
            cursor: pointer;
            color: #555;
        }

        .card-container {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }
        .card {
            background: white;
            flex: 1;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .card img {
            width: 100%;
            height: 140px;
            object-fit: cover;
        }
        .card-body {
            padding: 12px;
        }
        .card-title {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }
        .card-price {
            color: #e91e63;
            font-weight: bold;
            font-size: 14px;
        }
    </style>
    <script
      type="module"
      src="https://cdn.perxona.ai/asia/prod/latest/widget/entry/index.js"
    ></script>
</head>
<body>

    <h1>Welcome to My Personal Website!</h1>
    <p>Hi, I am a beginner building my first web project. Feel free to talk to my AI assistant down in the corner!</p>

    <div class="agent-container" id="agentWrapper">
        <div class="drag-handle" id="dragHandle"></div>
        <sv-agent
          id="myAgent"
          agentProfileId="01KP8ABYYJEXFYFY5R5NPGP0DZ"
          presentationMode="bubble"
          apiKey="4df0b8b9-13a5-4f0d-aa99-607eacf94190"
        ></sv-agent>
    </div>

    <div class="itinerary-popup" id="itineraryWindow">
        <span class="close-btn" id="closeItineraryBtn">&times;</span>
        <h2>想看日本三大花火大會 (3)</h2>
        <p style="background: rgba(255,255,255,0.8); padding: 15px; border-radius: 8px; font-size: 15px; line-height: 1.5;">
            如果你想看日本三大花火大會之一的長岡煙火，現在有不同的行程可以選擇，包括一日直達A區觀賞席、兩天一夜B區觀賞席加溫泉住宿，還有三天的彌彥神社巡禮和煙火體驗，讓你輕鬆享受壯觀的煙火盛會。
        </p>
        
        <div class="card-container">
            <div class="card">
                <img src="https://images.unsplash.com/photo-1533105079780-92b9be48
